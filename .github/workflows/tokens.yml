name: tokens

# 디자이너가 Tokens Studio로 tokens.json을 동기화한 PR에서 CSS를 다시 생성해 같은 브랜치에 커밋한다.
on:
  pull_request:
    paths:
      - "tokens/**"

permissions:
  contents: write

concurrency:
  group: tokens-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build-tokens:
    # 포크 PR은 브랜치에 push할 수 없어 제외
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - run: bun install --frozen-lockfile

      - run: bun run tokens:build

      - name: 생성 파일 커밋
        run: |
          if git diff --quiet -- src/app/tokens.generated.css; then
            echo "생성 파일 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/tokens.generated.css
          git commit -m "chore: 디자인 토큰 CSS 재생성"
          git push
